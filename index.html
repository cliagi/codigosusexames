<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Consulta de Códigos - Exames SUS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0, 20, 40, 0.12);
            padding: 2rem 2rem 3rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #0b2b44;
            text-align: center;
            margin-bottom: 0.25rem;
        }

        .subtitle {
            text-align: center;
            color: #2c5778;
            font-weight: 400;
            font-size: 1rem;
            margin-bottom: 0.5rem;
        }

        .header-meta {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            border-bottom: 1px solid #e9edf2;
            padding-bottom: 1rem;
            margin-bottom: 2rem;
        }

        .badge {
            background: #e4ecf5;
            color: #1e4a6b;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .search-box {
            background: #f7fafc;
            border-radius: 60px;
            padding: 0.4rem;
            display: flex;
            align-items: center;
            border: 1px solid #dce3ec;
            transition: 0.2s;
            margin: 1.5rem 0 2rem;
        }

        .search-box:focus-within {
            border-color: #1f7b9c;
            box-shadow: 0 0 0 4px rgba(26, 127, 158, 0.15);
            background: white;
        }

        .search-box input {
            flex: 1;
            border: none;
            padding: 0.9rem 1.5rem;
            font-size: 1.1rem;
            background: transparent;
            outline: none;
            color: #153e57;
            font-weight: 500;
        }

        .search-box input::placeholder {
            color: #8ba0b3;
            font-weight: 400;
        }

        .search-box button {
            background: #0b2b44;
            color: white;
            border: none;
            padding: 0.9rem 2.2rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.15s;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        .search-box button:hover {
            background: #123e5e;
            transform: scale(0.97);
        }

        .stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #2a5779;
            margin-bottom: 1.5rem;
            border-bottom: 1px dashed #d8e1eb;
            padding-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .stats span {
            background: #eef3f8;
            padding: 0.2rem 1rem;
            border-radius: 40px;
        }

        .results {
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
            margin-top: 0.5rem;
        }

        .result-card {
            background: white;
            border-radius: 16px;
            border: 1px solid #e2e9f2;
            padding: 0.8rem 1.5rem;
            transition: 0.2s;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem 1rem;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        .result-card:hover {
            border-color: #b7cedf;
            background: #fafdff;
            box-shadow: 0 6px 16px rgba(0, 30, 50, 0.06);
        }

        .result-name {
            flex: 2;
            min-width: 180px;
            font-weight: 500;
            color: #0e3147;
            font-size: 1rem;
            line-height: 1.4;
        }

        .code-badge {
            background: #e7edf6;
            padding: 0.35rem 1.2rem;
            border-radius: 40px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            font-weight: 600;
            color: #144664;
            letter-spacing: 0.3px;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1.5rem;
            color: #386482;
            background: #f6faff;
            border-radius: 40px;
            border: 1px dashed #b8cfdf;
        }

        .empty-state strong {
            font-size: 1.2rem;
            display: block;
            margin-bottom: 0.3rem;
        }

        .footer {
            margin-top: 2.5rem;
            text-align: center;
            font-size: 0.85rem;
            color: #5f7f96;
            border-top: 1px solid #e2eaf2;
            padding-top: 1.5rem;
        }

        .footer p {
            margin: 0.3rem 0;
        }

        .footer .data {
            font-weight: 600;
            color: #0b2b44;
        }

        @media (max-width: 700px) {
            .container { padding: 1.5rem 1rem; }
            .search-box { flex-wrap: wrap; background: transparent; border: none; gap: 0.5rem; }
            .search-box input { background: white; border-radius: 60px; border: 1px solid #d0dbe8; }
            .search-box button { width: 100%; justify-content: center; }
            .result-card { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header-meta">
        <div style="text-align: center; width: 100%;">
            <h1>🔬 Consulta de Códigos</h1>
            <p class="subtitle">Exames e Procedimentos</p>
            <span class="badge">📅 Atualizado em 15/08/2026</span>
        </div>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Digite o nome do exame (ex: glicose, TSH, HIV...)" />
        <button id="searchButton">🔍 Buscar</button>
    </div>

    <div class="stats">
        <span id="totalCount">📋 0 procedimentos carregados</span>
        <span id="resultCount">🔎 0 resultados</span>
    </div>

    <div id="resultsContainer" class="results"></div>

    <div class="footer">
        <p><span class="data">📅 15/08/2026</span></p>
        <p>Sistema elaborado para buscar códigos já em uso</p>
        <p>Todos os Direitos Reservados <strong>Daniele Basso</strong> © 2026</p>
    </div>
</div>

            ["0202010708", "VITAMINA B12"],
            ["0202010767", "VITAMINA D"]
        ];

        // Remover duplicatas (manter a primeira ocorrência)
        const uniqueProcedimentos = [];
        const seen = new Set();
        for (const item of procedimentos) {
            const key = item[0] + '|' + item[1];
            if (!seen.has(key)) {
                seen.add(key);
                uniqueProcedimentos.push(item);
            }
        }

        // ---------------------------------------------------------------
        // REFERÊNCIAS DOM
        // ---------------------------------------------------------------
        const searchInput = document.getElementById('searchInput');
        const searchButton = document.getElementById('searchButton');
        const resultsContainer = document.getElementById('resultsContainer');
        const totalCountSpan = document.getElementById('totalCount');
        const resultCountSpan = document.getElementById('resultCount');

        totalCountSpan.textContent = `📋 ${uniqueProcedimentos.length} procedimentos carregados`;

        // ---------------------------------------------------------------
        // FUNÇÃO DE BUSCA
        // ---------------------------------------------------------------
        function performSearch() {
            const query = searchInput.value.trim().toLowerCase();

            const filtered = query === ''
                ? uniqueProcedimentos
                : uniqueProcedimentos.filter(item => {
                    const nome = item[1].toLowerCase();
                    return nome.includes(query);
                });

            renderResults(filtered);
            resultCountSpan.textContent = `🔎 ${filtered.length} resultados`;
        }

        // ---------------------------------------------------------------
        // RENDERIZAÇÃO
        // ---------------------------------------------------------------
        function renderResults(items) {
            if (items.length === 0) {
                resultsContainer.innerHTML = `
                    <div class="empty-state">
                        <strong>🧪 Nenhum exame encontrado</strong>
                        <p>Tente usar termos como: <em>glicose, TSH, HIV, PCR, urina</em></p>
                    </div>
                `;
                return;
            }

            let html = '';
            for (const item of items) {
                const [codigo, nome] = item;
                html += `
                    <div class="result-card">
                        <div class="result-name">${nome}</div>
                        <span class="code-badge">${codigo}</span>
                    </div>
                `;
            }

            resultsContainer.innerHTML = html;
        }

        // ---------------------------------------------------------------
        // EVENTOS
        // ---------------------------------------------------------------
        searchButton.addEventListener('click', performSearch);
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                performSearch();
            }
        });

        renderResults(uniqueProcedimentos);
        resultCountSpan.textContent = `🔎 ${uniqueProcedimentos.length} resultados`;
        searchInput.focus();
    })();
</script>

</html>
