            align-items: center;

            background: transparent;
            outline: none;

            margin-top: 0.5rem;
        }

            justify-content: space-between;
            gap: 0.8rem 1.5rem;

        .result-card:hover {
            border-color: #b7cedf;
            background: #fafdff;
            box-shadow: 0 6px 16px rgba(0, 30, 50, 0.06);
        }

        .result-name {

            color: #0e3147;
            font-size: 1rem;
            line-height: 1.4;

        .result-name small {

            font-weight: 400;
            color: #50758f;
            font-size: 0.78rem;

        .code-group {

            flex-wrap: wrap;
            align-items: center;
            gap: 0.6rem 1.5rem;
        }

            font-size: 0.9rem;
            font-weight: 600;

            font-weight: 600;
            color: #146b3a;
            font-size: 0.9rem;
        }

        .valor-complemento {
            background: #f5f1e6;
            padding: 0.25rem 1rem;
            border-radius: 40px;
            font-weight: 500;
            color: #7e6a31;
            font-size: 0.85rem;
        }

        .valor-total {
            background: #e3eaf5;
            padding: 0.25rem 1rem;
            border-radius: 40px;
            font-weight: 600;
            color: #1d4d70;
            font-size: 0.9rem;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1.5rem;
            color: #386482;
            background: #f6faff;
            border-radius: 40px;
            border: 1px dashed #b8cfdf;
        }

        .empty-state strong {
            font-size: 1.2rem;
            display: block;
            margin-bottom: 0.3rem;
        }

        .footer {
            margin-top: 2.5rem;
            text-align: center;
            font-size: 0.8rem;
            color: #5f7f96;
            border-top: 1px solid #e2eaf2;

            text-decoration: none;

        }

        // ---------------------------------------------------------------
        // 2. REFERÊNCIAS DOM
        // ---------------------------------------------------------------
        const searchInput = document.getElementById('searchInput');
        const searchButton = document.getElementById('searchButton');
        const resultsContainer = document.getElementById('resultsContainer');
        const totalCountSpan = document.getElementById('totalCount');
        const resultCountSpan = document.getElementById('resultCount');

        // Atualiza contador total
        totalCountSpan.textContent = `📋 ${procedimentos.length} procedimentos carregados`;

        // ---------------------------------------------------------------
        // 3. FUNÇÃO DE BUSCA (case-insensitive, ordenada)
        // ---------------------------------------------------------------
        function performSearch() {
            const query = searchInput.value.trim().toLowerCase();

            // Se a busca estiver vazia, mostra todos
            const filtered = query === ''
                ? procedimentos
                : procedimentos.filter(item => {
                    const nome = item[1].toLowerCase();
                    return nome.includes(query);
                });

            renderResults(filtered);
            resultCountSpan.textContent = `🔎 ${filtered.length} resultados`;
        }

        // ---------------------------------------------------------------
        // 4. RENDERIZAÇÃO
        // ---------------------------------------------------------------
        function renderResults(items) {
            if (items.length === 0) {
                resultsContainer.innerHTML = `
                    <div class="empty-state">
                        <strong>🧪 Nenhum exame encontrado</strong>
                        <p>Tente usar termos como: <em>glicose, PCR, colesterol, TSH, urina, fezes</em></p>
                    </div>
                `;
                return;
            }

            let html = '';
            for (const item of items) {
                const [codigo, nome, valorSus, complemento, total] = item;
                html += `
                    <div class="result-card">
                        <div class="result-name">
                            ${nome}
                            <small>Código SUS: ${codigo}</small>
                        </div>
                        <div class="code-group">
                            <span class="code-badge">${codigo}</span>
                        </div>
                        <div class="value-group">
                            <span class="valor-sus">SUS: R$ ${valorSus}</span>
                            ${complemento !== '0,00' ? `<span class="valor-complemento">+ R$ ${complemento}</span>` : ''}
                            <span class="valor-total">Total: R$ ${total}</span>
                        </div>
                    </div>
                `;
            }

            resultsContainer.innerHTML = html;
        }

        // ---------------------------------------------------------------
        // 5. EVENTOS
        // ---------------------------------------------------------------
        searchButton.addEventListener('click', performSearch);
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                performSearch();
            }
        });

        // Ao carregar a página, mostra todos os procedimentos
        renderResults(procedimentos);
        resultCountSpan.textContent = `🔎 ${procedimentos.length} resultados`;

        // (Opcional) foco no input ao carregar
        searchInput.focus();
